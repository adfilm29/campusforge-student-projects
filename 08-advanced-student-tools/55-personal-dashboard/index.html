<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Life Dashboard</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · STUDENT INNOVATION</small><h1>Student Life Dashboard</h1><p>Create a personal dashboard of key goals, deadlines and study priorities.</p><input id="label" placeholder="Priority or deadline"><input id="date" type="date"><button id="add">Add to dashboard</button><div id="o"></div><script>let d=JSON.parse(localStorage.dash||'[]');function draw(){d.sort((a,b)=>a.d.localeCompare(b.d));o.innerHTML=d.map((x,i)=>'<p><label><input type="checkbox" data-i="'+i+'" '+(x.done?'checked':'')+'> '+x.l+' · '+x.d+'</label></p>').join('');o.querySelectorAll('input').forEach(c=>c.onchange=()=>{d[+c.dataset.i].done=c.checked;save()})}function save(){localStorage.dash=JSON.stringify(d);draw()}add.onclick=()=>{if(label.value&&date.value){d.push({l:label.value,d:date.value,done:false});save()}};draw();</script><p><small>Standalone browser prototype. No external services or live campus integrations.</small></p></body></html>
