<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course Load Planner</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · STUDENT INNOVATION</small><h1>Course Load Planner</h1><p>Estimate weekly study hours from subjects and credit weights.</p><input id="subject" placeholder="Subject"><input id="credits" type="number" min="1" value="3"><button id="add">Add subject</button><div id="o"></div><script>let d=[];add.onclick=()=>{if(subject.value&&+credits.value>0){d.push({s:subject.value,c:+credits.value});draw()}};function draw(){let total=d.reduce((a,x)=>a+x.c,0);o.innerHTML=d.map(x=>'<p>'+x.s+' · '+x.c+' credits · suggested '+(x.c*2)+' study hours/week</p>').join('')+'<h2>Suggested total: '+(total*2)+' hours/week</h2>'}</script><p><small>Standalone browser prototype. No external services or live campus integrations.</small></p></body></html>
