<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Snippet Vault</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · STUDENT INNOVATION</small><h1>Code Snippet Vault</h1><p>Save and search reusable code snippets by language.</p><input id="title" placeholder="Snippet title"><input id="lang" placeholder="Language"><textarea id="code" rows="7" placeholder="Paste code"></textarea><button id="add">Save snippet</button><input id="search" placeholder="Search snippets"><div id="o"></div><script>let d=JSON.parse(localStorage.snippets||'[]');function draw(){let s=search.value.toLowerCase();o.innerHTML=d.filter(x=>(x.t+x.l+x.c).toLowerCase().includes(s)).map(x=>'<article><b>'+x.t+'</b> · '+x.l+'<pre></pre></article>').join('');[...o.querySelectorAll('pre')].forEach((p,i)=>p.textContent=d.filter(x=>(x.t+x.l+x.c).toLowerCase().includes(s))[i].c)}function save(){localStorage.snippets=JSON.stringify(d);draw()}add.onclick=()=>{if(title.value&&lang.value&&code.value){d.push({t:title.value,l:lang.value,c:code.value});save()}};search.oninput=draw;draw();</script><p><small>Standalone browser prototype. No external services or live campus integrations.</small></p></body></html>
