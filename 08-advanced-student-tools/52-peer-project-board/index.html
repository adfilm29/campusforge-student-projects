<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Project Board</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · STUDENT INNOVATION</small><h1>Student Project Board</h1><p>Publish project ideas and let peers mark interest.</p><input id="title" placeholder="Project idea"><input id="skill" placeholder="Skills needed"><input id="owner" placeholder="Posted by"><button id="add">Publish idea</button><div id="o"></div><script>let d=JSON.parse(localStorage.ideas||'[]');function draw(){o.innerHTML=d.map((x,i)=>'<article><b>'+x.t+'</b><p>Skills: '+x.s+' · By '+x.o+'</p><button data-i="'+i+'">I am interested ('+x.n+')</button></article>').join('');o.querySelectorAll('button').forEach(b=>b.onclick=()=>{d[+b.dataset.i].n++;save()})}function save(){localStorage.ideas=JSON.stringify(d);draw()}add.onclick=()=>{if(title.value&&owner.value){d.push({t:title.value,s:skill.value,o:owner.value,n:0});save()}};draw();</script><p><small>Standalone browser prototype. No external services or live campus integrations.</small></p></body></html>
