<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canteen Meal Cost Planner</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · STUDENT INNOVATION</small><h1>Canteen Meal Cost Planner</h1><p>Compare meal combinations against a daily food budget.</p><input id="meal" placeholder="Meal item"><input id="price" type="number" min="0" step=".5" placeholder="Price ₹"><button id="add">Add item</button><input id="budget" type="number" value="150" placeholder="Daily budget ₹"><div id="o"></div><script>let d=[];add.onclick=()=>{if(meal.value&&+price.value>=0){d.push({m:meal.value,p:+price.value});draw()}};budget.oninput=draw;function draw(){let s=d.reduce((a,x)=>a+x.p,0),b=+budget.value;o.innerHTML=d.map(x=>'<p>'+x.m+' · ₹'+x.p.toFixed(2)+'</p>').join('')+'<h2>Total ₹'+s.toFixed(2)+'</h2><p>'+(s<=b?'Within budget by ₹'+(b-s).toFixed(2):'Over budget by ₹'+(s-b).toFixed(2))+'</p>'}</script><p><small>Standalone browser prototype. No external services or live campus integrations.</small></p></body></html>
