<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Goal Milestone Board</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:16px;border:1px solid #52618a;border-radius:12px;margin:12px 0}</style><body><small>CAMPUSFORGE · WELLBEING & PERSONAL GROWTH</small><h1>Goal Milestone Board</h1><p>Break a big personal or academic goal into trackable milestones.</p><input id="goal" placeholder="Main goal"><input id="step" placeholder="Milestone"><button id="add">Add milestone</button><div id="o"></div><script>let d=JSON.parse(localStorage.goals||'[]');function draw(){o.innerHTML=d.map((x,i)=>'<p><label><input type="checkbox" data-i="'+i+'" '+(x.done?'checked':'')+'> '+x.goal+': '+x.step+'</label></p>').join('');o.querySelectorAll('input').forEach(c=>c.onchange=()=>{d[+c.dataset.i].done=c.checked;save()})}function save(){localStorage.goals=JSON.stringify(d);draw()}add.onclick=()=>{if(goal.value&&step.value){d.push({goal:goal.value,step:step.value,done:false});save()}};draw();</script><p><small>Self-management prototype, not medical advice. Stored locally in this browser.</small></p></body></html>
