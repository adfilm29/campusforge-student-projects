<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screen Break Planner</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:16px;border:1px solid #52618a;border-radius:12px;margin:12px 0}</style><body><small>CAMPUSFORGE · WELLBEING & PERSONAL GROWTH</small><h1>Screen Break Planner</h1><p>Set a work duration and calculate a reminder time for a short break.</p><input id="mins" type="number" min="10" value="50" placeholder="Work minutes"><button id="go">Start interval</button><h2 id="o"></h2><script>go.onclick=()=>{let n=+mins.value;if(n<10){o.textContent='Choose at least 10 minutes';return}let end=new Date(Date.now()+n*60000);o.textContent='Break target: '+end.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})+' ('+n+' minutes from now). Keep this tab open; this prototype does not send notifications.'}</script><p><small>Self-management prototype, not medical advice. Stored locally in this browser.</small></p></body></html>
