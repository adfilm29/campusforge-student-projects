<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Budget Buddy</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · MONEY & WELLBEING</small><h1>Student Budget Buddy</h1><p>Track monthly income and expenses and see your remaining budget.</p><input id="label" placeholder="Expense or income"><input id="amount" type="number" step=".01" placeholder="Amount ₹"><select id="kind"><option>Expense</option><option>Income</option></select><button id="add">Add transaction</button><div id="o"></div><script>let d=JSON.parse(localStorage.budget||'[]');function draw(){let inc=d.filter(x=>x.k==='Income').reduce((s,x)=>s+x.v,0),exp=d.filter(x=>x.k==='Expense').reduce((s,x)=>s+x.v,0);o.innerHTML='<h2>Balance ₹'+(inc-exp).toFixed(2)+'</h2><p>Income ₹'+inc.toFixed(2)+' · Expenses ₹'+exp.toFixed(2)+'</p>'+d.map(x=>'<p>'+x.k+': '+x.n+' ₹'+x.v.toFixed(2)+'</p>').join('')}add.onclick=()=>{if(label.value&&+amount.value>0){d.push({n:label.value,v:+amount.value,k:kind.value});localStorage.budget=JSON.stringify(d);draw()}};draw();</script><p><small>Educational planning tool; not financial advice. Data is stored locally in your browser.</small></p></body></html>
