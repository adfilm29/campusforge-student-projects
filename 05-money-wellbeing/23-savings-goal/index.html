<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Savings Goal Tracker</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · MONEY & WELLBEING</small><h1>Savings Goal Tracker</h1><p>Estimate how much to save each week to reach a target.</p><input id="goal" type="number" placeholder="Savings goal ₹"><input id="saved" type="number" placeholder="Already saved ₹"><input id="weeks" type="number" min="1" placeholder="Weeks remaining"><button id="go">Calculate</button><h2 id="o"></h2><script>go.onclick=()=>{let g=+goal.value,s=+saved.value,w=+weeks.value;if(g<=s||w<1){o.textContent=g<=s?'Goal already reached.':'Enter valid values.';return}o.textContent='Save ₹'+((g-s)/w).toFixed(2)+' per week.'}</script><p><small>Educational planning tool; not financial advice. Data is stored locally in your browser.</small></p></body></html>
