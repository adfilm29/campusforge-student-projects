<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hydration Counter</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:16px;border:1px solid #52618a;border-radius:12px;margin:12px 0}</style><body><small>CAMPUSFORGE · WELLBEING & PERSONAL GROWTH</small><h1>Hydration Counter</h1><p>Track glasses of water against a daily target.</p><input id="target" type="number" value="8" min="1"><button id="minus">−</button><button id="plus">+ Add glass</button><h2 id="o"></h2><script>let n=0;function draw(){o.textContent=n+' / '+target.value+' glasses · '+Math.min(100,n/Math.max(1,+target.value)*100).toFixed(0)+'%'}plus.onclick=()=>{n++;draw()};minus.onclick=()=>{n=Math.max(0,n-1);draw()};target.oninput=draw;draw();</script><p><small>Self-management prototype, not medical advice. Stored locally in this browser.</small></p></body></html>
