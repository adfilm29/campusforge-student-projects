<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mood Journal</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:16px;border:1px solid #52618a;border-radius:12px;margin:12px 0}</style><body><small>CAMPUSFORGE · WELLBEING & PERSONAL GROWTH</small><h1>Mood Journal</h1><p>Record a daily mood and a short note locally on your device.</p><input id="date" type="date"><select id="mood"><option>Great</option><option>Good</option><option>Okay</option><option>Low</option><option>Stressed</option></select><textarea id="note" placeholder="What happened today?"></textarea><button id="add">Save entry</button><div id="o"></div><script>let d=JSON.parse(localStorage.moods||'[]');function draw(){o.innerHTML=d.slice().reverse().map(x=>'<article><b>'+x.date+' · '+x.mood+'</b><p>'+x.note+'</p></article>').join('')}add.onclick=()=>{if(date.value){d.push({date:date.value,mood:mood.value,note:note.value});localStorage.moods=JSON.stringify(d);note.value='';draw()}};draw();</script><p><small>Self-management prototype, not medical advice. Stored locally in this browser.</small></p></body></html>
