<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scholarship Deadline Planner</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · MONEY & WELLBEING</small><h1>Scholarship Deadline Planner</h1><p>Keep a list of scholarship names, due dates and application status.</p><input id="name" placeholder="Scholarship name"><input id="date" type="date"><button id="add">Add scholarship</button><div id="o"></div><script>let d=JSON.parse(localStorage.scholarships||'[]');function draw(){d.sort((a,b)=>a.date.localeCompare(b.date));o.innerHTML=d.map((x,i)=>'<p><b>'+x.name+'</b> · '+x.date+' <select data-i="'+i+'"><option '+(x.status==='Researching'?'selected':'')+'>Researching</option><option '+(x.status==='Preparing'?'selected':'')+'>Preparing</option><option '+(x.status==='Submitted'?'selected':'')+'>Submitted</option></select></p>').join('');o.querySelectorAll('select').forEach(s=>s.onchange=()=>{d[+s.dataset.i].status=s.value;save()})}function save(){localStorage.scholarships=JSON.stringify(d);draw()}add.onclick=()=>{if(name.value&&date.value){d.push({name:name.value,date:date.value,status:'Researching'});save()}};draw();</script><p><small>Educational planning tool; not financial advice. Data is stored locally in your browser.</small></p></body></html>
