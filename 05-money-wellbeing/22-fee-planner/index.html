<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Semester Fee Planner</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · MONEY & WELLBEING</small><h1>Semester Fee Planner</h1><p>Plan fee payments by splitting a total amount across due dates.</p><input id="total" type="number" placeholder="Total fee ₹"><input id="parts" type="number" min="1" value="4" placeholder="Number of installments"><button id="go">Calculate installments</button><div id="o"></div><script>go.onclick=()=>{let t=+total.value,n=+parts.value;if(t<=0||n<1){o.textContent='Enter valid values';return}let base=Math.floor(t/n*100)/100,arr=Array(n).fill(base);arr[n-1]=+(t-base*(n-1)).toFixed(2);o.innerHTML=arr.map((v,i)=>'<p>Installment '+(i+1)+': ₹'+v.toFixed(2)+'</p>').join('')+'<b>Total ₹'+arr.reduce((a,b)=>a+b,0).toFixed(2)+'</b>'}</script><p><small>Educational planning tool; not financial advice. Data is stored locally in your browser.</small></p></body></html>
