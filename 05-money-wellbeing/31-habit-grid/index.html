<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Habit Grid</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:16px;border:1px solid #52618a;border-radius:12px;margin:12px 0}</style><body><small>CAMPUSFORGE · WELLBEING & PERSONAL GROWTH</small><h1>Habit Grid</h1><p>Build a simple daily habit checklist with a seven-day view.</p><input id="habit" placeholder="Habit name"><button id="add">Add habit</button><div id="o"></div><script>let d=JSON.parse(localStorage.habits||'[]');function draw(){o.innerHTML=d.map((h,i)=>'<article><b>'+h.n+'</b><p>'+h.days.map((v,j)=>'<label><input type="checkbox" data-i="'+i+'" data-j="'+j+'" '+(v?'checked':'')+'> Day '+(j+1)+'</label>').join(' ')+'</p></article>').join('');o.querySelectorAll('input').forEach(c=>c.onchange=()=>{d[+c.dataset.i].days[+c.dataset.j]=c.checked;save()})}function save(){localStorage.habits=JSON.stringify(d);draw()}add.onclick=()=>{if(habit.value){d.push({n:habit.value,days:Array(7).fill(false)});habit.value='';save()}};draw();</script><p><small>Self-management prototype, not medical advice. Stored locally in this browser.</small></p></body></html>
