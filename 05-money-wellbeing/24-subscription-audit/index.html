<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subscription Audit</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · MONEY & WELLBEING</small><h1>Subscription Audit</h1><p>List recurring subscriptions and estimate monthly and annual costs.</p><input id="name" placeholder="Subscription"><input id="cost" type="number" step=".01" placeholder="Cost ₹"><select id="cycle"><option value="1">Monthly</option><option value="12">Yearly</option></select><button id="add">Add subscription</button><div id="o"></div><script>let d=[];add.onclick=()=>{if(name.value&&+cost.value>0){d.push({n:name.value,c:+cost.value,m:+cost.value/+cycle.value});draw()}};function draw(){let m=d.reduce((s,x)=>s+x.m,0);o.innerHTML=d.map(x=>'<p>'+x.n+' · ₹'+x.c.toFixed(2)+'</p>').join('')+'<h2>Monthly equivalent ₹'+m.toFixed(2)+'</h2><p>Annual equivalent ₹'+(m*12).toFixed(2)+'</p>'}</script><p><small>Educational planning tool; not financial advice. Data is stored locally in your browser.</small></p></body></html>
