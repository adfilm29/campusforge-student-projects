<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorting Lab</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · PROGRAMMING LAB</small><h1>Sorting Lab</h1><p>Compare bubble sort and selection sort step-by-step on a small array.</p><input id="values" value="8,3,6,1,9,2"><select id="algo"><option>Bubble sort</option><option>Selection sort</option></select><button id="go">Run sort</button><div id="o"></div><script>go.onclick=()=>{let a=values.value.split(',').map(Number);if(a.some(x=>!Number.isFinite(x))){o.textContent='Use comma-separated numbers';return}let steps=[];if(algo.value==='Bubble sort'){for(let i=0;i<a.length;i++)for(let j=0;j<a.length-i-1;j++){if(a[j]>a[j+1])[a[j],a[j+1]]=[a[j+1],a[j]];steps.push(a.join(', '))}}else{for(let i=0;i<a.length;i++){let m=i;for(let j=i+1;j<a.length;j++)if(a[j]<a[m])m=j;[a[i],a[m]]=[a[m],a[i]];steps.push(a.join(', '))}}o.innerHTML='<p>Steps: '+steps.length+'</p>'+steps.map((s,i)=>'<p>'+(i+1)+'. '+s+'</p>').join('')}</script></body></html>
