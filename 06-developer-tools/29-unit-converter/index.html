<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Unit Converter</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article,pre{padding:18px;border:1px solid #52618a;border-radius:12px;white-space:pre-wrap}</style><body><small>CAMPUSFORGE · DEVELOPER & STUDY TOOLS</small><h1>Campus Unit Converter</h1><p>Convert common length, weight and temperature units.</p><input id="v" type="number" value="1"><select id="kind"><option value="km">Kilometres → miles</option><option value="mi">Miles → kilometres</option><option value="kg">Kilograms → pounds</option><option value="lb">Pounds → kilograms</option><option value="c">Celsius → Fahrenheit</option><option value="f">Fahrenheit → Celsius</option></select><button id="go">Convert</button><h2 id="o"></h2><script>go.onclick=()=>{let x=+v.value,k=kind.value,m={km:x*.621371,mi:x/.621371,kg:x*2.20462,lb:x/2.20462,c:x*9/5+32,f:(x-32)*5/9};o.textContent=m[k].toFixed(3)}</script></body></html>
