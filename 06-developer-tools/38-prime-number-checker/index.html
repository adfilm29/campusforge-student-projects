<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prime Number Explorer</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · PROGRAMMING LAB</small><h1>Prime Number Explorer</h1><p>Check whether a number is prime and show the divisibility test.</p><input id="n" type="number" min="0" value="97"><button id="go">Check</button><h2 id="o"></h2><script>go.onclick=()=>{let n=+nInput.value;function prime(x){if(x<2)return false;for(let i=2;i<=Math.sqrt(x);i++)if(x%i===0)return false;return true}o.textContent=prime(n)?n+' is prime. No integer divisor exists up to √n.':n+' is not prime.'};const nInput=document.getElementById('n');go.click();</script></body></html>
