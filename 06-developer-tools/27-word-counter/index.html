<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Assignment Word Counter</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article,pre{padding:18px;border:1px solid #52618a;border-radius:12px;white-space:pre-wrap}</style><body><small>CAMPUSFORGE · DEVELOPER & STUDY TOOLS</small><h1>Assignment Word Counter</h1><p>Count words, characters, sentences and estimated reading time.</p><textarea id="src" rows="12" placeholder="Paste your assignment draft..."></textarea><div id="o"></div><script>src.oninput=()=>{let t=src.value.trim(),w=t?t.split(/\s+/).length:0,s=t?t.split(/[.!?]+/).filter(x=>x.trim()).length:0;o.innerHTML='<h2>'+w+' words</h2><p>'+src.value.length+' characters · '+s+' sentences · '+Math.ceil(w/200)+' min reading time</p>'};src.oninput();</script></body></html>
