<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Binary Search Lab</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · PROGRAMMING LAB</small><h1>Binary Search Lab</h1><p>Visualize binary search on a sorted list and inspect each midpoint.</p><input id="values" value="2,4,6,8,10,12,14"><input id="target" type="number" value="10"><button id="go">Search</button><div id="o"></div><script>go.onclick=()=>{let a=values.value.split(',').map(Number).sort((x,y)=>x-y),t=+target.value,l=0,r=a.length-1,log=[],found=-1;while(l<=r){let m=Math.floor((l+r)/2);log.push('low '+l+', mid '+m+' ('+a[m]+'), high '+r);if(a[m]===t){found=m;break}if(a[m]<t)l=m+1;else r=m-1}o.innerHTML=log.map((x,i)=>'<p>Step '+(i+1)+': '+x+'</p>').join('')+'<h2>'+(found>=0?'Found at index '+found:'Not found')+'</h2>'}</script></body></html>
