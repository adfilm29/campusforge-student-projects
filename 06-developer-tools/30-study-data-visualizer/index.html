<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Time Analyzer</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article,pre{padding:18px;border:1px solid #52618a;border-radius:12px;white-space:pre-wrap}</style><body><small>CAMPUSFORGE · DEVELOPER & STUDY TOOLS</small><h1>Study Time Analyzer</h1><p>Log study sessions and see total time by subject.</p><input id="subject" placeholder="Subject"><input id="hours" type="number" min=".1" step=".1" placeholder="Hours studied"><button id="add">Log session</button><div id="o"></div><script>let d=JSON.parse(localStorage.studylog||'[]');add.onclick=()=>{if(subject.value&&+hours.value>0){d.push({s:subject.value,h:+hours.value});localStorage.studylog=JSON.stringify(d);draw()}};function draw(){let m={};d.forEach(x=>m[x.s]=(m[x.s]||0)+x.h);let max=Math.max(1,...Object.values(m));o.innerHTML=Object.entries(m).map(([s,h])=>'<p>'+s+' · '+h.toFixed(1)+'h</p><div style="height:12px;background:#9eafff;width:'+(h/max*100)+'%;border-radius:8px"></div>').join('')+'<h2>Total '+d.reduce((a,x)=>a+x.h,0).toFixed(1)+' hours</h2>'}draw();</script></body></html>
