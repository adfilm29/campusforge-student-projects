<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Markdown Quick Preview</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article,pre{padding:18px;border:1px solid #52618a;border-radius:12px;white-space:pre-wrap}</style><body><small>CAMPUSFORGE · DEVELOPER & STUDY TOOLS</small><h1>Markdown Quick Preview</h1><p>Write basic Markdown and preview headings, lists and bold text.</p><textarea id="src" rows="10"># My Notes

- First point
- Second point

**Important concept**</textarea><button id="go">Preview</button><article id="o"></article><script>go.onclick=()=>{let s=src.value.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');s=s.replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>').replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/^[-*] (.*)$/gm,'<p>• $1</p>').replace(/\*\*(.*?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');o.innerHTML=s};go.click();</script></body></html>
