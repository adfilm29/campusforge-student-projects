<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JSON Inspector</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article,pre{padding:18px;border:1px solid #52618a;border-radius:12px;white-space:pre-wrap}</style><body><small>CAMPUSFORGE · DEVELOPER & STUDY TOOLS</small><h1>JSON Inspector</h1><p>Validate JSON and pretty-print it with useful error feedback.</p><textarea id="src" rows="9" placeholder='{"student":"Asha","year":1}'></textarea><button id="go">Validate & format</button><pre id="o"></pre><script>go.onclick=()=>{try{o.textContent=JSON.stringify(JSON.parse(src.value),null,2);o.style.color='#a7f3d0'}catch(e){o.textContent='Invalid JSON: '+e.message;o.style.color='#fca5a5'}}</script></body></html>
