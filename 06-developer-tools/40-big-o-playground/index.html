<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Big-O Growth Playground</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · PROGRAMMING LAB</small><h1>Big-O Growth Playground</h1><p>Compare approximate operation counts for common complexity classes.</p><input id="n" type="number" min="1" max="100000" value="100"><button id="go">Compare</button><div id="o"></div><script>go.onclick=()=>{let n=Math.max(1,+n.value);let vals=[['O(1)',1],['O(log₂ n)',Math.log2(n)],['O(n)',n],['O(n log n)',n*Math.log2(n)],['O(n²)',n*n]];o.innerHTML=vals.map(([k,v])=>'<p>'+k+': '+Math.round(v).toLocaleString()+' operations (approx.)</p>').join('')}</script></body></html>
