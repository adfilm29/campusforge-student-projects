<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fibonacci Explorer</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · PROGRAMMING LAB</small><h1>Fibonacci Explorer</h1><p>Generate the Fibonacci sequence for a requested number of terms.</p><input id="count" type="number" min="1" max="50" value="12"><button id="go">Generate</button><div id="o"></div><script>go.onclick=()=>{let n=Math.max(1,Math.min(50,+count.value||1)),a=0,b=1,r=[];for(let i=0;i<n;i++){r.push(a);[a,b]=[b,a+b]}o.textContent=r.join(', ')}</script></body></html>
