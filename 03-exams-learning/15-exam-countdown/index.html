<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam Countdown</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}fieldset{margin:14px 0;border:1px solid #52618a;border-radius:10px}</style><body><small>CAMPUSFORGE · EXAMS & LEARNING</small><h1>Exam Countdown</h1><p>Calculate days remaining until your exam date and set a daily target.</p><input id="exam" type="date"><input id="chapters" type="number" min="0" placeholder="Chapters remaining"><button id="go">Calculate plan</button><h2 id="o"></h2><script>go.onclick=()=>{if(!exam.value){o.textContent='Choose an exam date';return}let days=Math.ceil((new Date(exam.value+'T00:00:00')-new Date(new Date().toDateString()))/86400000),c=+chapters.value;o.textContent=days<0?'Exam date has passed.':days===0?'Exam is today.':days+' days left. Target: '+(c?Math.ceil(c/days):'set your chapters')+' chapters per day.'}</script></body></html>
