<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Revision Roulette</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}fieldset{margin:14px 0;border:1px solid #52618a;border-radius:10px}</style><body><small>CAMPUSFORGE · EXAMS & LEARNING</small><h1>Revision Roulette</h1><p>Randomly select a topic from your revision list to avoid decision paralysis.</p><textarea id="topics" rows="8" placeholder="One topic per line"></textarea><button id="pick">Pick my next topic</button><h2 id="o"></h2><script>pick.onclick=()=>{let a=topics.value.split('\n').map(x=>x.trim()).filter(Boolean);o.textContent=a.length?a[Math.floor(Math.random()*a.length)]:'Add topics first'}</script></body></html>
