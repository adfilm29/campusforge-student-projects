<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CGPA Estimator</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}fieldset{margin:14px 0;border:1px solid #52618a;border-radius:10px}</style><body><small>CAMPUSFORGE · EXAMS & LEARNING</small><h1>CGPA Estimator</h1><p>Estimate semester GPA from course credits and grade points.</p><input id="course" placeholder="Course name"><input id="credit" type="number" min="1" placeholder="Credits"><input id="grade" type="number" min="0" max="10" step=".1" placeholder="Grade point / 10"><button id="add">Add course</button><div id="o"></div><script>let d=[];add.onclick=()=>{let c=+credit.value,g=+grade.value;if(course.value&&c>0&&g>=0&&g<=10){d.push({n:course.value,c,g});draw()}};function draw(){let cr=d.reduce((s,x)=>s+x.c,0),pts=d.reduce((s,x)=>s+x.c*x.g,0);o.innerHTML=d.map(x=>'<p>'+x.n+' · '+x.c+' credits · '+x.g+'</p>').join('')+'<h2>Estimated GPA: '+(cr?(pts/cr).toFixed(2):'—')+'/10</h2>'}</script></body></html>
