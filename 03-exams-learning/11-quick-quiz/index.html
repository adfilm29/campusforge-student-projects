<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickQuiz Builder</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}fieldset{margin:14px 0;border:1px solid #52618a;border-radius:10px}</style><body><small>CAMPUSFORGE · EXAMS & LEARNING</small><h1>QuickQuiz Builder</h1><p>Write multiple-choice questions, attempt them, and get an instant score.</p><input id="q" placeholder="Question"><input id="opts" placeholder="Options separated by commas"><input id="correct" placeholder="Correct option text"><button id="add">Add question</button><button id="start">Attempt quiz</button><div id="o"></div><script>let d=[];add.onclick=()=>{let a=opts.value.split(',').map(x=>x.trim());if(q.value&&a.length>1&&a.includes(correct.value)){d.push({q:q.value,a,c:correct.value});q.value='';opts.value='';correct.value='';o.textContent=d.length+' questions added'}};start.onclick=()=>{if(!d.length)return;o.innerHTML=d.map((x,i)=>'<fieldset><legend>'+x.q+'</legend>'+x.a.map(v=>'<label><input type="radio" name="q'+i+'" value="'+v+'">'+v+'</label><br>').join('')+'</fieldset>').join('')+'<button id="grade">Submit</button>';document.getElementById('grade').onclick=()=>{let s=d.filter((x,i)=>document.querySelector('input[name=q'+i+']:checked')?.value===x.c).length;o.insertAdjacentHTML('beforeend','<h2>Score '+s+'/'+d.length+'</h2>')}};</script></body></html>
