<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reading Progress Tracker</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}fieldset{margin:14px 0;border:1px solid #52618a;border-radius:10px}</style><body><small>CAMPUSFORGE · EXAMS & LEARNING</small><h1>Reading Progress Tracker</h1><p>Track pages read and calculate completion percentage.</p><input id="book" placeholder="Book or chapter"><input id="total" type="number" min="1" placeholder="Total pages"><input id="read" type="number" min="0" placeholder="Pages read"><button id="calc">Update progress</button><h2 id="o"></h2><script>calc.onclick=()=>{let t=+total.value,r=+read.value;if(!book.value||t<1||r<0||r>t){o.textContent='Check book and page values';return}o.textContent=book.value+': '+(r/t*100).toFixed(1)+'% complete ('+r+'/'+t+' pages)'}</script></body></html>
