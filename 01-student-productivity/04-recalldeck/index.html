<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RecallDeck Flashcards</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:24px;border:1px solid #52618a;border-radius:12px;margin:18px 0}</style><body><small>CAMPUSFORGE · STUDENT PROJECT LAB</small><h1>RecallDeck Flashcards</h1><p>Create and flip question-answer cards for revision.</p><input id="q" placeholder="Question"><textarea id="v" placeholder="Answer"></textarea><button id="add">Add card</button><button id="flip">Flip</button><button id="next">Next</button><article id="card"></article><p id="pos"></p><script>let d=JSON.parse(localStorage.deck||'[]'),i=0,b=false;function show(){card.textContent=d.length?(b?d[i][1]:d[i][0]):'No cards yet';pos.textContent=d.length?(i+1)+' / '+d.length:''}add.onclick=()=>{if(q.value&&v.value){d.push([q.value,v.value]);localStorage.deck=JSON.stringify(d);i=d.length-1;b=false;show()}};flip.onclick=()=>{b=!b;show()};next.onclick=()=>{if(d.length){i=(i+1)%d.length;b=false;show()}};show();</script><p><small>Local browser demo; data is not uploaded to a server.</small></p></body></html>
