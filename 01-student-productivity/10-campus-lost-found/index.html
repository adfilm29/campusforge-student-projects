<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Post lost/found items and search the local board."><title>FindIt Campus Board | CampusForge</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui;padding:32px;max-width:850px;margin:auto}header{margin-bottom:24px}h1{font-size:clamp(2rem,6vw,3.2rem);margin:8px 0}p{color:#aab6d3}label{display:block;margin:14px 0;color:#b9c6e5}input,select,textarea{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #34415f;border-radius:10px;background:#141d33;color:white;font:inherit}button{padding:10px 15px;margin:8px 6px 8px 0;border:0;border-radius:9px;background:#8b9cff;color:#10152a;font-weight:700;cursor:pointer}article,fieldset,#card{border:1px solid #34415f;border-radius:12px;padding:15px;margin:12px 0;background:#121b30}#card{min-height:120px;display:grid;place-items:center;font-size:1.25rem}footer{margin-top:40px;color:#8492b5;font-size:.85rem}</style></head><body><header><p>CAMPUSFORGE · STUDENT PROJECT LAB</p><h1>FindIt Campus Board</h1><p>Post lost/found items and search the local board.</p></header><main><label>Item <input id="item" placeholder="Blue water bottle"></label><label>Type <select id="type"><option>Lost</option><option>Found</option></select></label><label>Location <input id="place" placeholder="Library"></label><button id="add">Post item</button><label>Search <input id="search" placeholder="Search item or location"></label><div id="out"></div></main><footer>Runs in your browser. Data is stored locally on this device; it is not synced to a server.</footer><script>let posts=JSON.parse(localStorage.posts||'[]');function draw(){let s=search.value.toLowerCase();out.innerHTML=posts.filter(p=>(p.item+' '+p.place+' '+p.type).toLowerCase().includes(s)).map(p=>'<article><b>'+p.type+': '+p.item+'</b><p>'+p.place+'</p></article>').join('')||'No matching posts'}function save(){localStorage.posts=JSON.stringify(posts);draw()}add.onclick=()=>{if(item.value&&place.value){posts.unshift({item:item.value,type:type.value,place:place.value});item.value='';place.value='';save()}};search.oninput=draw;draw();</script></body></html>
