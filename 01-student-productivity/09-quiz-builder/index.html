<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create a multiple-choice quiz and score your answers."><title>QuickQuiz Builder | CampusForge</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui;padding:32px;max-width:850px;margin:auto}header{margin-bottom:24px}h1{font-size:clamp(2rem,6vw,3.2rem);margin:8px 0}p{color:#aab6d3}label{display:block;margin:14px 0;color:#b9c6e5}input,select,textarea{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #34415f;border-radius:10px;background:#141d33;color:white;font:inherit}button{padding:10px 15px;margin:8px 6px 8px 0;border:0;border-radius:9px;background:#8b9cff;color:#10152a;font-weight:700;cursor:pointer}article,fieldset,#card{border:1px solid #34415f;border-radius:12px;padding:15px;margin:12px 0;background:#121b30}#card{min-height:120px;display:grid;place-items:center;font-size:1.25rem}footer{margin-top:40px;color:#8492b5;font-size:.85rem}</style></head><body><header><p>CAMPUSFORGE · STUDENT PROJECT LAB</p><h1>QuickQuiz Builder</h1><p>Create a multiple-choice quiz and score your answers.</p></header><main><label>Question <input id="question" placeholder="Question"></label><label>Options (comma separated) <input id="opts" placeholder="A,B,C,D"></label><label>Correct option <input id="correct" placeholder="Exact option text"></label><button id="add">Add question</button><button id="play">Start quiz</button><div id="out"></div></main><footer>Runs in your browser. Data is stored locally on this device; it is not synced to a server.</footer><script>let qs=[];add.onclick=()=>{let o=opts.value.split(',').map(x=>x.trim()).filter(Boolean);if(question.value&&o.length>1&&o.includes(correct.value)){qs.push({q:question.value,o,c:correct.value});question.value='';opts.value='';correct.value='';out.textContent=qs.length+' questions created'}};play.onclick=()=>{if(!qs.length)return;let score=0;out.innerHTML=qs.map((q,i)=>'<fieldset><legend>'+q.q+'</legend>'+q.o.map(o=>'<label><input type="radio" name="q'+i+'" value="'+o.replaceAll('"','&quot;')+'"> '+o+'</label><br>').join('')+'</fieldset>').join('')+'<button id="grade">Submit answers</button>';document.getElementById('grade').onclick=()=>{score=qs.filter((q,i)=>document.querySelector('input[name=q'+i+']:checked')?.value===q.c).length;out.insertAdjacentHTML('beforeend','<h2>Score: '+score+'/'+qs.length+'</h2>')}};</script></body></html>
