<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Create and flip revision cards saved in your browser."><title>RecallDeck Flashcards | CampusForge</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui;padding:32px;max-width:850px;margin:auto}header{margin-bottom:24px}h1{font-size:clamp(2rem,6vw,3.2rem);margin:8px 0}p{color:#aab6d3}label{display:block;margin:14px 0;color:#b9c6e5}input,select,textarea{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #34415f;border-radius:10px;background:#141d33;color:white;font:inherit}button{padding:10px 15px;margin:8px 6px 8px 0;border:0;border-radius:9px;background:#8b9cff;color:#10152a;font-weight:700;cursor:pointer}article,fieldset,#card{border:1px solid #34415f;border-radius:12px;padding:15px;margin:12px 0;background:#121b30}#card{min-height:120px;display:grid;place-items:center;font-size:1.25rem}footer{margin-top:40px;color:#8492b5;font-size:.85rem}</style></head><body><header><p>CAMPUSFORGE · STUDENT PROJECT LAB</p><h1>RecallDeck Flashcards</h1><p>Create and flip revision cards saved in your browser.</p></header><main><label>Question <input id="q" placeholder="Question"></label><label>Answer <textarea id="a" placeholder="Answer"></textarea></label><button id="add">Save card</button><button id="flip">Flip current card</button><div id="card">No cards yet</div><p id="position"></p><button id="next">Next</button></main><footer>Runs in your browser. Data is stored locally on this device; it is not synced to a server.</footer><script>let deck=JSON.parse(localStorage.deck||"[]"),idx=0,back=false;function show(){if(!deck.length){card.textContent='No cards yet';position.textContent='';return}card.textContent=back?deck[idx].a:deck[idx].q;position.textContent=(idx+1)+' / '+deck.length}add.onclick=()=>{if(q.value&&a.value){deck.push({q:q.value,a:a.value});localStorage.deck=JSON.stringify(deck);q.value='';a.value='';idx=deck.length-1;back=false;show()}};flip.onclick=()=>{back=!back;show()};next.onclick=()=>{if(deck.length){idx=(idx+1)%deck.length;back=false;show()}};show();</script></body></html>
