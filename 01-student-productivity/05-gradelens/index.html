<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GradeLens Marksheet</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:24px;border:1px solid #52618a;border-radius:12px;margin:18px 0}</style><body><small>CAMPUSFORGE · STUDENT PROJECT LAB</small><h1>GradeLens Marksheet</h1><p>Calculate aggregate marks and a simple grade.</p><input id="s" placeholder="Subject"><input id="v" type="number" placeholder="Obtained"><input id="m" type="number" value="100" placeholder="Maximum"><button id="add">Add subject</button><div id="o"></div><script>let d=[];add.onclick=()=>{let v=+document.getElementById('v').value,m=+document.getElementById('m').value;if(s.value&&m>0&&v>=0&&v<=m){d.push([s.value,v,m]);draw()}};function draw(){let v=d.reduce((a,x)=>a+x[1],0),m=d.reduce((a,x)=>a+x[2],0),p=m?v/m*100:0;o.innerHTML=d.map(x=>'<p>'+x[0]+': '+x[1]+'/'+x[2]+'</p>').join('')+'<h2>'+p.toFixed(1)+'% · '+(p>=90?'A+':p>=80?'A':p>=70?'B':p>=60?'C':p>=40?'D':'—')+'</h2>'}draw();</script><p><small>Local browser demo; data is not uploaded to a server.</small></p></body></html>
