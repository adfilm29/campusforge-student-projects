<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AttendX Calculator</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:24px;border:1px solid #52618a;border-radius:12px;margin:18px 0}</style><body><small>CAMPUSFORGE · STUDENT PROJECT LAB</small><h1>AttendX Calculator</h1><p>Find your attendance percentage and classes needed to reach a target.</p><label>Attended<input id="a" type="number" value="32"></label><label>Total<input id="t" type="number" value="40"></label><label>Target %<input id="p" type="number" value="75"></label><button id="go">Calculate</button><h2 id="o"></h2><script>go.onclick=()=>{let x=+a.value,y=+t.value,z=+p.value;if(y<x||y<=0||z<=0||z>100){o.textContent='Invalid inputs';return}let n=Math.max(0,Math.ceil((z*y-x)/(1-z/100)));o.textContent=(100*x/y).toFixed(2)+'% attendance. '+(n?'Attend '+n+' consecutive classes to reach target.':'Target reached!')};go.click();</script><p><small>Local browser demo; data is not uploaded to a server.</small></p></body></html>
