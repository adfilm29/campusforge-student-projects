<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Keep a local checklist of scholarship application documents."><title>Scholarship Checklist | CampusForge</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui;padding:32px;max-width:850px;margin:auto}header{margin-bottom:24px}h1{font-size:clamp(2rem,6vw,3.2rem);margin:8px 0}p{color:#aab6d3}label{display:block;margin:14px 0;color:#b9c6e5}input,select,textarea{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #34415f;border-radius:10px;background:#141d33;color:white;font:inherit}button{padding:10px 15px;margin:8px 6px 8px 0;border:0;border-radius:9px;background:#8b9cff;color:#10152a;font-weight:700;cursor:pointer}article,fieldset,#card{border:1px solid #34415f;border-radius:12px;padding:15px;margin:12px 0;background:#121b30}#card{min-height:120px;display:grid;place-items:center;font-size:1.25rem}footer{margin-top:40px;color:#8492b5;font-size:.85rem}</style></head><body><header><p>CAMPUSFORGE · STUDENT PROJECT LAB</p><h1>Scholarship Checklist</h1><p>Keep a local checklist of scholarship application documents.</p></header><main><label>Document <input id="doc" placeholder="Income certificate"></label><button id="add">Add requirement</button><div id="out"></div></main><footer>Runs in your browser. Data is stored locally on this device; it is not synced to a server.</footer><script>let docs=JSON.parse(localStorage.docs||'["Aadhaar card","Income certificate","Previous marksheet","Bank passbook"]');function draw(){out.innerHTML=docs.map((d,i)=>'<p><label><input type="checkbox"> '+d+'</label> <button data-i="'+i+'">Delete</button></p>').join('');out.querySelectorAll('button').forEach(b=>b.onclick=()=>{docs.splice(+b.dataset.i,1);save()});out.querySelectorAll('input[type=checkbox]').forEach((c,i)=>c.checked=JSON.parse(localStorage.checked||'[]').includes(i));out.querySelectorAll('input[type=checkbox]').forEach((c,i)=>c.onchange=()=>{let s=JSON.parse(localStorage.checked||'[]');s=c.checked?[...s,i]:s.filter(x=>x!==i);localStorage.checked=JSON.stringify(s)})}function save(){localStorage.docs=JSON.stringify(docs);localStorage.checked='[]';draw()}add.onclick=()=>{if(doc.value.trim()){docs.push(doc.value.trim());doc.value='';save()}};draw();</script></body></html>
