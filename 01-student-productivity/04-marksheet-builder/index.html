<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Compute weighted subject totals, average, and grade."><title>GradeLens Marksheet | CampusForge</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui;padding:32px;max-width:850px;margin:auto}header{margin-bottom:24px}h1{font-size:clamp(2rem,6vw,3.2rem);margin:8px 0}p{color:#aab6d3}label{display:block;margin:14px 0;color:#b9c6e5}input,select,textarea{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #34415f;border-radius:10px;background:#141d33;color:white;font:inherit}button{padding:10px 15px;margin:8px 6px 8px 0;border:0;border-radius:9px;background:#8b9cff;color:#10152a;font-weight:700;cursor:pointer}article,fieldset,#card{border:1px solid #34415f;border-radius:12px;padding:15px;margin:12px 0;background:#121b30}#card{min-height:120px;display:grid;place-items:center;font-size:1.25rem}footer{margin-top:40px;color:#8492b5;font-size:.85rem}</style></head><body><header><p>CAMPUSFORGE · STUDENT PROJECT LAB</p><h1>GradeLens Marksheet</h1><p>Compute weighted subject totals, average, and grade.</p></header><main><label>Subject <input id="sub" placeholder="Subject"></label><label>Marks obtained <input id="got" type="number" min="0"></label><label>Maximum marks <input id="max" type="number" min="1" value="100"></label><button id="add">Add subject</button><div id="out"></div></main><footer>Runs in your browser. Data is stored locally on this device; it is not synced to a server.</footer><script>let rows=[];function draw(){let g=rows.reduce((s,x)=>s+x.g,0),m=rows.reduce((s,x)=>s+x.m,0),p=m?g/m*100:0;out.innerHTML='<ul>'+rows.map(x=>'<li>'+x.s+': '+x.g+'/'+x.m+'</li>').join('')+'</ul><h2>'+p.toFixed(2)+'% · '+(p>=90?'A+':p>=80?'A':p>=70?'B':p>=60?'C':p>=40?'D':'Needs improvement')+'</h2>'; }add.onclick=()=>{let g=+got.value,m=+max.value;if(!sub.value||m<=0||g<0||g>m)return;rows.push({s:sub.value,g,m});sub.value='';draw()};draw();</script></body></html>
