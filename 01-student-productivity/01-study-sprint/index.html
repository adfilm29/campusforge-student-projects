<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudySprint Planner</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:24px;border:1px solid #52618a;border-radius:12px;margin:18px 0}</style><body><small>CAMPUSFORGE · STUDENT PROJECT LAB</small><h1>StudySprint Planner</h1><p>Plan study sessions and mark topics complete.</p><input id="t" placeholder="Topic"><input id="m" type="number" value="45" min="5"><button id="a">Add</button><div id="o"></div><script>let d=JSON.parse(localStorage.s||'[]');function draw(){o.innerHTML=d.map((x,i)=>'<p><input type="checkbox" data-i="'+i+'" '+(x[1]?'checked':'')+'> '+x[0]+' ('+x[2]+' min)</p>').join('');o.querySelectorAll('input').forEach(c=>c.onchange=()=>{d[+c.dataset.i][1]=c.checked;save()})}function save(){localStorage.s=JSON.stringify(d);draw()}a.onclick=()=>{if(t.value&&+m.value>=5){d.push([t.value,false,+m.value]);t.value='';save()}};draw();</script><p><small>Local browser demo; data is not uploaded to a server.</small></p></body></html>
