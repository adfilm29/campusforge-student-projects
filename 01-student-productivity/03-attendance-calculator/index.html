<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculate attendance percentage and classes needed to reach a target."><title>AttendX Calculator | CampusForge</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui;padding:32px;max-width:850px;margin:auto}header{margin-bottom:24px}h1{font-size:clamp(2rem,6vw,3.2rem);margin:8px 0}p{color:#aab6d3}label{display:block;margin:14px 0;color:#b9c6e5}input,select,textarea{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #34415f;border-radius:10px;background:#141d33;color:white;font:inherit}button{padding:10px 15px;margin:8px 6px 8px 0;border:0;border-radius:9px;background:#8b9cff;color:#10152a;font-weight:700;cursor:pointer}article,fieldset,#card{border:1px solid #34415f;border-radius:12px;padding:15px;margin:12px 0;background:#121b30}#card{min-height:120px;display:grid;place-items:center;font-size:1.25rem}footer{margin-top:40px;color:#8492b5;font-size:.85rem}</style></head><body><header><p>CAMPUSFORGE · STUDENT PROJECT LAB</p><h1>AttendX Calculator</h1><p>Calculate attendance percentage and classes needed to reach a target.</p></header><main><label>Classes attended <input id="att" type="number" min="0" value="32"></label><label>Total classes <input id="total" type="number" min="0" value="40"></label><label>Target % <input id="target" type="number" min="1" max="100" value="75"></label><button id="calc">Calculate</button><div id="out"></div></main><footer>Runs in your browser. Data is stored locally on this device; it is not synced to a server.</footer><script>calc.onclick=()=>{let a=+att.value,t=+total.value,p=+target.value;if(t<a||t<=0||p<=0||p>100){out.textContent='Enter valid values: total must be at least attended.';return}let pct=a/t*100;let need=Math.max(0,Math.ceil((p*t-a)/(1-p/100)));out.innerHTML='<h2>'+pct.toFixed(1)+'% attendance</h2><p>'+(pct>=p?'Target achieved.':'Attend '+need+' consecutive classes to reach '+p+'%.')+'</p><p>Missed: '+(t-a)+' classes</p>'};calc.click();</script></body></html>
