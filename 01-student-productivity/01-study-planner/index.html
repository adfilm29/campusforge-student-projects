<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Turn subjects and available hours into a realistic daily study plan."><title>StudySprint Planner | CampusForge</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui;padding:32px;max-width:850px;margin:auto}header{margin-bottom:24px}h1{font-size:clamp(2rem,6vw,3.2rem);margin:8px 0}p{color:#aab6d3}label{display:block;margin:14px 0;color:#b9c6e5}input,select,textarea{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #34415f;border-radius:10px;background:#141d33;color:white;font:inherit}button{padding:10px 15px;margin:8px 6px 8px 0;border:0;border-radius:9px;background:#8b9cff;color:#10152a;font-weight:700;cursor:pointer}article,fieldset,#card{border:1px solid #34415f;border-radius:12px;padding:15px;margin:12px 0;background:#121b30}#card{min-height:120px;display:grid;place-items:center;font-size:1.25rem}footer{margin-top:40px;color:#8492b5;font-size:.85rem}</style></head><body><header><p>CAMPUSFORGE · STUDENT PROJECT LAB</p><h1>StudySprint Planner</h1><p>Turn subjects and available hours into a realistic daily study plan.</p></header><main><label>Subject <input id="subject" placeholder="e.g. Fundamentals of Computers"></label><label>Hours available <input id="hours" type="number" min="1" max="16" value="4"></label><label>Priority <select id="priority"><option>High</option><option>Medium</option><option>Low</option></select></label><button id="add">Add study block</button><div id="out"></div></main><footer>Runs in your browser. Data is stored locally on this device; it is not synced to a server.</footer><script>let blocks=JSON.parse(localStorage.blocks||"[]");function draw(){out.innerHTML=blocks.map((b,i)=>'<article><b>'+b.subject+'</b> · '+b.hours+'h · '+b.priority+' <button data-i="'+i+'">Done</button></article>').join('');out.querySelectorAll('button').forEach(x=>x.onclick=()=>{blocks.splice(+x.dataset.i,1);save()})}function save(){localStorage.blocks=JSON.stringify(blocks);draw()}add.onclick=()=>{if(!subject.value.trim()||+hours.value<1)return;blocks.push({subject:subject.value.trim(),hours:+hours.value,priority:priority.value});subject.value='';save()};draw();</script></body></html>
