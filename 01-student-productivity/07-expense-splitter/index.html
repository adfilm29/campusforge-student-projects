<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Split shared expenses fairly between roommates."><title>RoomieSplit | CampusForge</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui;padding:32px;max-width:850px;margin:auto}header{margin-bottom:24px}h1{font-size:clamp(2rem,6vw,3.2rem);margin:8px 0}p{color:#aab6d3}label{display:block;margin:14px 0;color:#b9c6e5}input,select,textarea{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #34415f;border-radius:10px;background:#141d33;color:white;font:inherit}button{padding:10px 15px;margin:8px 6px 8px 0;border:0;border-radius:9px;background:#8b9cff;color:#10152a;font-weight:700;cursor:pointer}article,fieldset,#card{border:1px solid #34415f;border-radius:12px;padding:15px;margin:12px 0;background:#121b30}#card{min-height:120px;display:grid;place-items:center;font-size:1.25rem}footer{margin-top:40px;color:#8492b5;font-size:.85rem}</style></head><body><header><p>CAMPUSFORGE · STUDENT PROJECT LAB</p><h1>RoomieSplit</h1><p>Split shared expenses fairly between roommates.</p></header><main><label>Expense name <input id="name" placeholder="Groceries"></label><label>Amount ₹ <input id="amount" type="number" min="0.01" step="0.01"></label><label>Paid by <input id="payer" placeholder="Name"></label><label>People (comma separated) <input id="people" placeholder="Aman, Riya, Dev"></label><button id="add">Add expense</button><div id="out"></div></main><footer>Runs in your browser. Data is stored locally on this device; it is not synced to a server.</footer><script>let expenses=[];add.onclick=()=>{let p=people.value.split(',').map(x=>x.trim()).filter(Boolean),v=+amount.value;if(!name.value||v<=0||p.length<1||!payer.value)return;expenses.push({n:name.value,v,p,payer:payer.value});render()};function render(){let bal={};expenses.forEach(e=>{e.p.forEach(p=>bal[p]=(bal[p]||0)-e.v/e.p.length);bal[e.payer]=(bal[e.payer]||0)+e.v});out.innerHTML='<h3>Balances</h3>'+Object.entries(bal).map(([p,v])=>'<p>'+p+': '+(v>=0?'gets back ':'owes ')+ '₹'+Math.abs(v).toFixed(2)+'</p>').join('')+'<hr>'+expenses.map(e=>'<p>'+e.n+' — ₹'+e.v.toFixed(2)+' paid by '+e.payer+'</p>').join('')}</script></body></html>
