<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deadline Radar</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:24px;border:1px solid #52618a;border-radius:12px;margin:18px 0}</style><body><small>CAMPUSFORGE · STUDENT PROJECT LAB</small><h1>Deadline Radar</h1><p>Save assignment deadlines and flag overdue work.</p><input id="n" placeholder="Assignment"><input id="d" type="date"><button id="add">Save</button><div id="o"></div><script>let x=JSON.parse(localStorage.d||'[]');function draw(){o.innerHTML=x.map((v,i)=>'<p>'+v[0]+' · '+v[1]+' '+(v[1]<new Date().toISOString().slice(0,10)?'OVERDUE':'Upcoming')+' <button data-i="'+i+'">×</button></p>').join('');o.querySelectorAll('button').forEach(b=>b.onclick=()=>{x.splice(+b.dataset.i,1);save()})}function save(){localStorage.d=JSON.stringify(x);draw()}add.onclick=()=>{if(n.value&&d.value){x.push([n.value,d.value]);n.value='';save()}};draw();</script><p><small>Local browser demo; data is not uploaded to a server.</small></p></body></html>
