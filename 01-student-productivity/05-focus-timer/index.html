<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="A simple 25-minute focus session with break tracking."><title>FocusFlow Timer | CampusForge</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#edf2ff;font:16px system-ui;padding:32px;max-width:850px;margin:auto}header{margin-bottom:24px}h1{font-size:clamp(2rem,6vw,3.2rem);margin:8px 0}p{color:#aab6d3}label{display:block;margin:14px 0;color:#b9c6e5}input,select,textarea{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #34415f;border-radius:10px;background:#141d33;color:white;font:inherit}button{padding:10px 15px;margin:8px 6px 8px 0;border:0;border-radius:9px;background:#8b9cff;color:#10152a;font-weight:700;cursor:pointer}article,fieldset,#card{border:1px solid #34415f;border-radius:12px;padding:15px;margin:12px 0;background:#121b30}#card{min-height:120px;display:grid;place-items:center;font-size:1.25rem}footer{margin-top:40px;color:#8492b5;font-size:.85rem}</style></head><body><header><p>CAMPUSFORGE · STUDENT PROJECT LAB</p><h1>FocusFlow Timer</h1><p>A simple 25-minute focus session with break tracking.</p></header><main><h2 id="clock">25:00</h2><p id="status">Ready to focus</p><button id="start">Start</button><button id="reset">Reset</button><p>Completed sessions: <b id="count">0</b></p></main><footer>Runs in your browser. Data is stored locally on this device; it is not synced to a server.</footer><script>let left=1500,timer=null,sessions=+(localStorage.sessions||0);count.textContent=sessions;function paint(){clock.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0')}start.onclick=()=>{if(timer){clearInterval(timer);timer=null;start.textContent='Resume';return}status.textContent='Focus session in progress';start.textContent='Pause';timer=setInterval(()=>{left--;paint();if(left<=0){clearInterval(timer);timer=null;sessions++;localStorage.sessions=sessions;count.textContent=sessions;status.textContent='Session complete. Take a 5-minute break.';start.textContent='Start'}},1000)};reset.onclick=()=>{clearInterval(timer);timer=null;left=1500;paint();start.textContent='Start';status.textContent='Ready to focus'};paint();</script></body></html>
