<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Source Citation Organizer</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · AI & KNOWLEDGE WORKFLOWS</small><h1>Source Citation Organizer</h1><p>Keep track of source title, author, URL and access date for assignments.</p><input id="title" placeholder="Source title"><input id="author" placeholder="Author or organization"><input id="url" placeholder="URL"><button id="add">Save source</button><div id="o"></div><script>let d=JSON.parse(localStorage.sources||'[]');function draw(){o.innerHTML=d.map(x=>'<article><b>'+x.t+'</b><p>'+x.a+' · '+x.date+'</p><a href="'+x.u+'" target="_blank" rel="noopener">'+x.u+'</a></article>').join('')}add.onclick=()=>{if(title.value&&url.value){d.push({t:title.value,a:author.value,u:url.value,date:new Date().toLocaleDateString()});localStorage.sources=JSON.stringify(d);draw()}};draw();</script><p><small>These are offline productivity prototypes. They do not claim to call an AI model.</small></p></body></html>
