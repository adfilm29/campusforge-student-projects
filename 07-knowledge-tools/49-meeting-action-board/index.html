<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meeting Action Board</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · AI & KNOWLEDGE WORKFLOWS</small><h1>Meeting Action Board</h1><p>Convert meeting notes into owners and due dates for follow-up.</p><input id="task" placeholder="Action item"><input id="owner" placeholder="Owner"><input id="due" type="date"><button id="add">Add action</button><div id="o"></div><script>let d=JSON.parse(localStorage.actions||'[]');function draw(){o.innerHTML=d.map((x,i)=>'<p><label><input type="checkbox" data-i="'+i+'" '+(x.done?'checked':'')+'> '+x.t+' — '+x.o+' · '+x.d+'</label></p>').join('');o.querySelectorAll('input').forEach(c=>c.onchange=()=>{d[+c.dataset.i].done=c.checked;save()})}function save(){localStorage.actions=JSON.stringify(d);draw()}add.onclick=()=>{if(task.value&&owner.value&&due.value){d.push({t:task.value,o:owner.value,d:due.value,done:false});save()}};draw();</script><p><small>These are offline productivity prototypes. They do not claim to call an AI model.</small></p></body></html>
