<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lecture Note Structurer</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · AI & KNOWLEDGE WORKFLOWS</small><h1>Lecture Note Structurer</h1><p>Turn rough notes into a structured outline with headings and action points.</p><textarea id="src" rows="10" placeholder="Paste rough lecture notes..."></textarea><button id="go">Structure notes</button><article id="o"></article><script>go.onclick=()=>{let lines=src.value.split('\n').map(x=>x.trim()).filter(Boolean);o.innerHTML='<h3>Structured outline</h3>'+lines.map(x=>'<p>• '+x.replaceAll('<','&lt;')+'</p>').join('')+'<h3>Review questions</h3><p>1. What is the central idea?</p><p>2. Which terms need definitions?</p><p>3. What example can you explain without notes?</p>'}</script><p><small>These are offline productivity prototypes. They do not claim to call an AI model.</small></p></body></html>
