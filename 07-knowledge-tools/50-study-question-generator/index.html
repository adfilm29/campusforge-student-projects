<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Question Generator</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · AI & KNOWLEDGE WORKFLOWS</small><h1>Study Question Generator</h1><p>Generate self-test questions from a pasted paragraph using transparent templates, without an AI API.</p><textarea id="src" rows="10" placeholder="Paste a paragraph or topic notes..."></textarea><button id="go">Generate practice prompts</button><div id="o"></div><script>go.onclick=()=>{let t=src.value.trim();if(!t){o.textContent='Paste notes first';return}let words=t.split(/\s+/).slice(0,12).join(' ');o.innerHTML=['Explain the main idea in your own words.','Define the key terms in: '+words,'Give one real-world example related to these notes.','What could be a likely exam question from this topic?','Summarize the paragraph in three bullet points.'].map((x,i)=>'<p>'+(i+1)+'. '+x+'</p>').join('')+'<small>Template-based prompts only; no model inference is performed.</small>'}</script><p><small>These are offline productivity prototypes. They do not claim to call an AI model.</small></p></body></html>
