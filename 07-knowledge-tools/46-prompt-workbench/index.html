<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prompt Workbench</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · AI & KNOWLEDGE WORKFLOWS</small><h1>Prompt Workbench</h1><p>Build reusable prompts with role, context, task and output constraints.</p><input id="role" placeholder="Role (e.g. patient C tutor)"><textarea id="context" placeholder="Context and background"></textarea><textarea id="task" placeholder="Task to perform"></textarea><input id="format" placeholder="Output format"><button id="go">Build prompt</button><textarea id="o" rows="8"></textarea><button id="copy">Copy prompt</button><script>go.onclick=()=>{o.value='Role: '+role.value+'\nContext: '+context.value+'\nTask: '+task.value+'\nOutput format: '+format.value+'\nConstraints: State assumptions, avoid inventing facts, and explain uncertainty.'};copy.onclick=()=>navigator.clipboard?.writeText(o.value)</script><p><small>These are offline productivity prototypes. They do not claim to call an AI model.</small></p></body></html>
