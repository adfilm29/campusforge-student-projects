<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Interview Drill Deck</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input:not([type=range]),textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · CAREER & PLACEMENT</small><h1>Interview Drill Deck</h1><p>Practice common interview questions with a timer and self-review.</p><button id="next">New question</button><h2 id="q">Press new question</h2><textarea id="answer" rows="5" placeholder="Write your answer..."></textarea><button id="save">Save reflection</button><div id="o"></div><script>let qs=['Tell me about a project you built.','Explain a difficult bug you solved.','Why are you interested in this internship?','Describe how you learn a new technology.','Explain a concept you recently taught someone.'];next.onclick=()=>{q.textContent=qs[Math.floor(Math.random()*qs.length)];answer.value=''};save.onclick=()=>{o.textContent='Reflection saved for this session: '+answer.value.slice(0,180)}</script><p><small>Prototype utility. Verify all claims and numbers before using them in an actual job application.</small></p></body></html>
