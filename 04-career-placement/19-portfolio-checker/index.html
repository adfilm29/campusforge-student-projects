<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portfolio Project Evaluator</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input:not([type=range]),textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · CAREER & PLACEMENT</small><h1>Portfolio Project Evaluator</h1><p>Score a portfolio project across clarity, functionality, documentation and originality.</p><label>Problem clarity <input id="a" type="range" min="1" max="5" value="3"></label><label>Working demo <input id="b" type="range" min="1" max="5" value="3"></label><label>Documentation <input id="c" type="range" min="1" max="5" value="3"></label><label>Originality <input id="d" type="range" min="1" max="5" value="3"></label><button id="go">Evaluate</button><h2 id="o"></h2><script>go.onclick=()=>{let s=[a,b,c,d].reduce((n,x)=>n+ +x.value,0);o.textContent=s+'/20 · '+(s>=17?'Portfolio-ready; polish edge cases.':s>=12?'Promising; improve the weakest dimension.':'Strengthen the core before publishing.')}</script><p><small>Prototype utility. Verify all claims and numbers before using them in an actual job application.</small></p></body></html>
