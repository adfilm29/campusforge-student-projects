<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skill Gap Mapper</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input:not([type=range]),textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · CAREER & PLACEMENT</small><h1>Skill Gap Mapper</h1><p>Compare skills required by a target role with your current skills.</p><input id="role" placeholder="Target role"><textarea id="required" placeholder="Required skills, comma separated"></textarea><textarea id="known" placeholder="Skills you already have, comma separated"></textarea><button id="go">Compare skills</button><div id="o"></div><script>go.onclick=()=>{let r=required.value.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean),k=known.value.toLowerCase().split(',').map(x=>x.trim());o.innerHTML='<h3>'+role.value+'</h3><p>Already have: '+r.filter(x=>k.includes(x)).join(', ')+'</p><p>Skills to learn: '+r.filter(x=>!k.includes(x)).join(', ')+'</p>'}</script><p><small>Prototype utility. Verify all claims and numbers before using them in an actual job application.</small></p></body></html>
