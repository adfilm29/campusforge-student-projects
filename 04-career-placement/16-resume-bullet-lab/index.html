<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resume Bullet Lab</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input:not([type=range]),textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · CAREER & PLACEMENT</small><h1>Resume Bullet Lab</h1><p>Turn a rough task description into a stronger action-impact resume bullet using a guided template.</p><input id="action" placeholder="Action verb (built, analyzed, organized)"><input id="work" placeholder="What did you do?"><input id="tool" placeholder="Tools or skills used"><input id="impact" placeholder="Measurable result (if known)"><button id="go">Generate bullet</button><article id="o"></article><script>go.onclick=()=>{if(!action.value||!work.value){o.textContent='Add an action and what you did.';return}o.textContent=action.value+' '+work.value+(tool.value?' using '+tool.value:'')+(impact.value?', resulting in '+impact.value:'')+'.'}</script><p><small>Prototype utility. Verify all claims and numbers before using them in an actual job application.</small></p></body></html>
