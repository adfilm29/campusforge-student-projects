<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Networking Follow-up Tracker</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input:not([type=range]),textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · CAREER & PLACEMENT</small><h1>Networking Follow-up Tracker</h1><p>Keep a lightweight local record of professional contacts and follow-up dates.</p><input id="name" placeholder="Contact name"><input id="context" placeholder="Where did you meet?"><input id="date" type="date"><button id="add">Add contact</button><div id="o"></div><script>let d=JSON.parse(localStorage.contacts||'[]');function draw(){o.innerHTML=d.map((x,i)=>'<p><b>'+x.n+'</b> · '+x.c+' · Follow up: '+x.d+' <button data-i="'+i+'">Delete</button></p>').join('');o.querySelectorAll('button').forEach(b=>b.onclick=()=>{d.splice(+b.dataset.i,1);save()})}function save(){localStorage.contacts=JSON.stringify(d);draw()}add.onclick=()=>{if(name.value&&context.value&&date.value){d.push({n:name.value,c:context.value,d:date.value});save()}};draw();</script><p><small>Prototype utility. Verify all claims and numbers before using them in an actual job application.</small></p></body></html>
