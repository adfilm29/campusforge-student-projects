<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Internship Pipeline</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · STUDENT PROJECT LAB</small><h1>Internship Pipeline</h1><p>Track internship applications and move them through hiring stages.</p><input id="company" placeholder="Company"><input id="role" placeholder="Role"><button id="add">Add application</button><div id="o"></div><script>let d=JSON.parse(localStorage.ip||'[]');function draw(){o.innerHTML=d.map((x,i)=>'<article><b>'+x.c+'</b> · '+x.r+'<select data-i="'+i+'">'+['Saved','Applied','Interview','Offer','Rejected'].map(s=>'<option '+(x.s===s?'selected':'')+'>'+s+'</option>').join('')+'</select></article>').join('');o.querySelectorAll('select').forEach(s=>s.onchange=()=>{d[+s.dataset.i].s=s.value;save()})}function save(){localStorage.ip=JSON.stringify(d);draw()}add.onclick=()=>{if(company.value&&role.value){d.push({c:company.value,r:role.value,s:'Saved'});save()}};draw();</script><p><small>Browser-only demo. Data stays in localStorage on this device.</small></p></body></html>
