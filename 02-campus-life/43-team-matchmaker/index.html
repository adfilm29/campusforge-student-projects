<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Team Matchmaker</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · CAMPUS INNOVATION</small><h1>Project Team Matchmaker</h1><p>Find complementary teammates by matching required skills with student profiles.</p><input id="name" placeholder="Student name"><input id="skills" placeholder="Skills (Python, design, research)"><button id="add">Add profile</button><input id="need" placeholder="Project needs (comma separated)"><button id="match">Find matches</button><div id="o"></div><script>let d=[];add.onclick=()=>{if(name.value&&skills.value){d.push({n:name.value,s:skills.value.toLowerCase().split(',').map(x=>x.trim())});o.textContent='Profile added for '+name.value}};match.onclick=()=>{let need=needInput.value.toLowerCase().split(',').map(x=>x.trim()).filter(Boolean);o.innerHTML=d.map(x=>({n:x.n,m:need.filter(k=>x.s.includes(k))})).sort((a,b)=>b.m.length-a.m.length).map(x=>'<p>'+x.n+' · '+x.m.length+' matches: '+x.m.join(', ')+'</p>').join('')||'Add profiles first'};const needInput=document.getElementById('need');</script><p><small>Prototype uses manually entered data; it is not connected to a live college system.</small></p></body></html>
