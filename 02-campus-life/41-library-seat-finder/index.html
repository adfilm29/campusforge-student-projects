<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Library Seat Planner</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · CAMPUS INNOVATION</small><h1>Library Seat Planner</h1><p>Estimate seat availability by recording occupied and total seats.</p><input id="total" type="number" value="120" min="1" placeholder="Total seats"><input id="used" type="number" value="80" min="0" placeholder="Occupied seats"><button id="go">Check availability</button><h2 id="o"></h2><script>go.onclick=()=>{let t=+total.value,u=+used.value;if(t<1||u>t||u<0){o.textContent='Check seat counts';return}o.textContent=(t-u)+' seats available ('+((t-u)/t*100).toFixed(1)+'%). This is a manual estimate, not live campus data.'}</script><p><small>Prototype uses manually entered data; it is not connected to a live college system.</small></p></body></html>
