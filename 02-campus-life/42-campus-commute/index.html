<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campus Commute Calculator</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · CAMPUS INNOVATION</small><h1>Campus Commute Calculator</h1><p>Estimate commute cost per week from fare and travel days.</p><input id="fare" type="number" min="0" step=".5" value="25" placeholder="One-way fare ₹"><input id="days" type="number" min="1" max="7" value="5" placeholder="Days per week"><button id="go">Estimate</button><h2 id="o"></h2><script>go.onclick=()=>{let f=+fare.value,d=+days.value;if(f<0||d<1||d>7){o.textContent='Check inputs';return}o.textContent='Weekly ₹'+(f*2*d).toFixed(2)+' · Monthly estimate ₹'+(f*2*d*4.33).toFixed(2)}</script><p><small>Prototype uses manually entered data; it is not connected to a live college system.</small></p></body></html>
