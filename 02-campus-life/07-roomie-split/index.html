<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RoomieSplit</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · STUDENT PROJECT LAB</small><h1>RoomieSplit</h1><p>Split shared costs and calculate each person's net balance.</p><input id="amount" type="number" placeholder="Amount ₹"><input id="payer" placeholder="Paid by"><input id="people" placeholder="People: A, B, C"><button id="add">Add expense</button><div id="o"></div><script>let es=[];add.onclick=()=>{let p=people.value.split(',').map(x=>x.trim()).filter(Boolean),v=+amount.value;if(v>0&&payer.value&&p.length){es.push({v,p,payer:payer.value});draw()}};function draw(){let b={};es.forEach(e=>{e.p.forEach(p=>b[p]=(b[p]||0)-e.v/e.p.length);b[e.payer]=(b[e.payer]||0)+e.v});o.innerHTML=Object.entries(b).map(([k,v])=>'<p>'+k+': '+(v>=0?'gets ₹':'owes ₹')+Math.abs(v).toFixed(2)+'</p>').join('')}</script><p><small>Browser-only demo. Data stays in localStorage on this device.</small></p></body></html>
