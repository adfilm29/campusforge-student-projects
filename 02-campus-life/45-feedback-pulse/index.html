<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anonymous Course Feedback</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · CAMPUS INNOVATION</small><h1>Anonymous Course Feedback</h1><p>Collect local course feedback ratings and display the average.</p><input id="course" placeholder="Course name"><label>Rating (1–5)<input id="rating" type="number" min="1" max="5" value="4"></label><textarea id="note" placeholder="What should improve?"></textarea><button id="add">Submit feedback</button><div id="o"></div><script>let d=JSON.parse(localStorage.feedback||'[]');add.onclick=()=>{let r=+rating.value;if(course.value&&r>=1&&r<=5){d.push({c:course.value,r,n:note.value});localStorage.feedback=JSON.stringify(d);draw()}};function draw(){let avg=d.length?d.reduce((s,x)=>s+x.r,0)/d.length:0;o.innerHTML='<h2>'+d.length+' responses · '+avg.toFixed(1)+'/5 average</h2>'+d.map(x=>'<p>'+x.c+' · '+x.r+'/5 — '+x.n+'</p>').join('')}</script><p><small>Prototype uses manually entered data; it is not connected to a live college system.</small></p></body></html>
