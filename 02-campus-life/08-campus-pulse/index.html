<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CampusPulse Event Planner</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · STUDENT PROJECT LAB</small><h1>CampusPulse Event Planner</h1><p>Create campus events and record registrations against capacity.</p><input id="name" placeholder="Event name"><input id="date" type="date"><input id="cap" type="number" value="30"><button id="add">Create event</button><div id="o"></div><script>let es=JSON.parse(localStorage.ev||'[]');function draw(){o.innerHTML=es.map((e,i)=>'<article><b>'+e.name+'</b> · '+e.date+'<p>'+e.n+'/'+e.cap+' registered</p><button data-i="'+i+'">Register</button></article>').join('');o.querySelectorAll('button').forEach(b=>b.onclick=()=>{let e=es[+b.dataset.i];if(e.n<e.cap)e.n++;save()})}function save(){localStorage.ev=JSON.stringify(es);draw()}add.onclick=()=>{if(name.value&&date.value&&+cap.value>0){es.push({name:name.value,date:date.value,cap:+cap.value,n:0});save()}};draw();</script><p><small>Browser-only demo. Data stays in localStorage on this device.</small></p></body></html>
