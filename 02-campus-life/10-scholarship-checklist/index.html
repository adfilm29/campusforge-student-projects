<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scholarship Checklist</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · STUDENT PROJECT LAB</small><h1>Scholarship Checklist</h1><p>Manage a reusable checklist of documents for scholarship applications.</p><input id="doc" placeholder="Required document"><button id="add">Add document</button><div id="o"></div><script>let d=JSON.parse(localStorage.sc||'["Aadhaar card","Income certificate","Previous marksheet","Bank passbook"]');function draw(){o.innerHTML=d.map((x,i)=>'<p><label><input type="checkbox"> '+x+'</label> <button data-i="'+i+'">Remove</button></p>').join('');o.querySelectorAll('button').forEach(b=>b.onclick=()=>{d.splice(+b.dataset.i,1);save()})}function save(){localStorage.sc=JSON.stringify(d);draw()}add.onclick=()=>{if(doc.value){d.push(doc.value);doc.value='';save()}};draw();</script><p><small>Browser-only demo. Data stays in localStorage on this device.</small></p></body></html>
