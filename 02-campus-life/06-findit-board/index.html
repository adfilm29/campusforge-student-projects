<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FindIt Campus Board</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}article{padding:18px;border:1px solid #52618a;border-radius:12px;margin:14px 0}</style><body><small>CAMPUSFORGE · STUDENT PROJECT LAB</small><h1>FindIt Campus Board</h1><p>Post lost or found items and search the campus noticeboard.</p><input id="item" placeholder="Item name"><select id="kind"><option>Lost</option><option>Found</option></select><input id="place" placeholder="Location"><button id="add">Post item</button><input id="search" placeholder="Search posts"><div id="o"></div><script>let d=JSON.parse(localStorage.fi||'[]');function draw(){let s=search.value.toLowerCase();o.innerHTML=d.filter(x=>(x.item+x.place+x.kind).toLowerCase().includes(s)).map(x=>'<article><b>'+x.kind+': '+x.item+'</b><p>'+x.place+'</p></article>').join('')||'No matches'}add.onclick=()=>{if(item.value&&place.value){d.unshift({item:item.value,place:place.value,kind:kind.value});localStorage.fi=JSON.stringify(d);draw()}};search.oninput=draw;draw();</script><p><small>Browser-only demo. Data stays in localStorage on this device.</small></p></body></html>
