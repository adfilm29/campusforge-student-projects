<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peer Tutor Board</title><style>body{max-width:760px;margin:40px auto;padding:24px;background:#0d1428;color:#edf2ff;font:16px system-ui}input,select,textarea{display:block;width:100%;padding:12px;margin:12px 0;box-sizing:border-box;background:#1b2947;color:white;border:1px solid #52618a;border-radius:8px}button{padding:10px 16px;background:#a9b8ff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}</style><body><small>CAMPUSFORGE · CAMPUS INNOVATION</small><h1>Peer Tutor Board</h1><p>Post a topic you can teach or need help learning.</p><input id="name" placeholder="Your name"><input id="topic" placeholder="Topic or subject"><select id="kind"><option>Can teach</option><option>Need help</option></select><button id="add">Post listing</button><input id="search" placeholder="Search topic"><div id="o"></div><script>let d=JSON.parse(localStorage.tutors||'[]');function draw(){let s=search.value.toLowerCase();o.innerHTML=d.filter(x=>x.t.toLowerCase().includes(s)).map(x=>'<p><b>'+x.t+'</b> · '+x.k+' — '+x.n+'</p>').join('')}add.onclick=()=>{if(name.value&&topic.value){d.push({n:name.value,t:topic.value,k:kind.value});localStorage.tutors=JSON.stringify(d);draw()}};search.oninput=draw;draw();</script><p><small>Prototype uses manually entered data; it is not connected to a live college system.</small></p></body></html>
